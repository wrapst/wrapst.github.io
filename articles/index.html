<!DOCTYPE html>

<head>

    <meta charset="UTF-8">

    <link rel="stylesheet" href="/css/shared.css">

    <link rel="stylesheet" href="/css/base.css">

    <link rel="stylesheet" href="/css/snipped.css">




    <link rel="icon" href="/svg/favicon.svg" type="image/svg+xml">



    <meta property="og:type" content="website">

    <meta property="og:site_name" content="Wrapst">

    <meta name="twitter:card" content="summary_large_image">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [

        {
          "@type": "WebSite",
          "@id": "https://wrapst.com/#website",
          "url": "https://wrapst.com/",
          "name": "Wrapst",
          "description": "Thoughtful, clear and visually focused stories about design, technology and science.",
          "inLanguage": "en"
        },

        {
          "@type": "Organization",
          "@id": "https://wrapst.com/#organization",
          "name": "Wrapst",
          "url": "https://wrapst.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://wrapst.com/img/favicon.png"
          }
        },

        {
          "@type": "CollectionPage",
          "@id": "https://wrapst.com/articles/#webpage",
          "url": "https://wrapst.com/articles/",
          "name": "Articles - Wrapst",
          "description": "A collection of Wrapst articles covering design, technology and science.",
          "isPartOf": {
            "@id": "https://wrapst.com/#website"
          },
          "about": {
            "@id": "https://wrapst.com/#organization"
          },
          "inLanguage": "en"
        }

      ]
    }

    <script src="/script/components-loader.js" defer>
    </script>

    <script src="/script/base.js" defer>
    </script>

    <script src="/script/snipped.js" defer>
    </script>

</head>


<body class="flex column">



    <div id="navbar"></div>


    <main>



        <section class="flex column hero" aria-labelledby="trending-heading">


            <h1 id="trending-heading">
                Trending categories
            </h1>


            <div class="flex row cat-holder" aria-label="Trending article categories">


                <button type="button" class="flex cat" data-category="design" aria-label="Browse Design articles">

                    <img src="/img/categories/design.jpg" alt="Design">

                    <h5>
                        Design
                    </h5>

                </button>


                <button type="button" class="flex cat" data-category="tech" aria-label="Browse Tech articles">

                    <img src="/img/categories/tech.jpg" alt="Tech">

                    <h5>
                        Tech
                    </h5>

                </button>


                <button type="button" class="flex cat" data-category="science" aria-label="Browse Science articles">

                    <img src="/img/categories/science.jpg" alt="Science">

                    <h5>
                        Science
                    </h5>

                </button>


            </div>

        </section>


        <div class="spacer-small"></div>


        <section class="flex column list" aria-labelledby="articles-heading">


            <div class="flex row headings">


                <h2 id="articles-heading">
                    Articles:
                </h2>


                <div class="category-select">


                    <button type="button" class="category-select-button" id="category-select-button"
                        aria-haspopup="listbox" aria-expanded="false" aria-controls="category-options">


                        <h2 id="selected-category" class="transparent">

                            Category: All

                        </h2>


                        <span class="flex category-arrow" aria-hidden="true">


                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">

                                <path d="M19.92 8.95001L13.4 15.47C12.63 16.24 11.37 16.24 10.6 15.47L4.07996 8.95001"
                                    stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10"
                                    stroke-linecap="round" stroke-linejoin="round" />

                            </svg>


                        </span>

                    </button>


                    <div class="category-options" id="category-options" role="listbox"
                        aria-label="Select article category">


                        <button type="button" role="option" data-category="all" aria-selected="true">

                            <h2 class="transparent">
                                All
                            </h2>

                        </button>


                        <button type="button" role="option" data-category="tech" aria-selected="false">

                            <h2 class="transparent">
                                Tech
                            </h2>

                        </button>


                        <button type="button" role="option" data-category="design" aria-selected="false">

                            <h2 class="transparent">
                                Design
                            </h2>

                        </button>


                        <button type="button" role="option" data-category="science" aria-selected="false">

                            <h2 class="transparent">
                                Science
                            </h2>

                        </button>


                        <button type="button" role="option" data-category="lifestyle" aria-selected="false">

                            <h2 class="transparent">
                                Lifestyle
                            </h2>

                        </button>


                    </div>


                </div>


            </div>


            <div class="line" aria-hidden="true">
            </div>



            <div class="flex column snipped-holder" id="snipped-holder" aria-live="polite">
            </div>


        </section>


    </main>


    <div class="spacer"></div>


    <div id="footer"></div>


</body>

</html>
