            <article>
                <h1>The Planet That Shouldn't Exist</h1>

                <p>
                    Some discoveries expand what we know. Others make the things
                    we already know feel less certain. GJ 523b belongs to the
                    second kind.
                </p>

                <p>
                    The planet has about 23.5 times the mass of Earth, yet its
                    radius is only about 2.55 times larger. Its measured density
                    suggests that, despite its size, it contains relatively
                    little of the thick hydrogen and helium envelope normally
                    expected around a planet this massive.
                </p>

                <p>
                    GJ 523b is not simply another distant world. It is a world
                    that appears to sit uncomfortably between the categories
                    we use to describe planets.
                </p>

                <blockquote>
                    The universe does not have to fit neatly into the categories
                    we created to understand it.
                </blockquote>

                <p>
                    Its mass and density create a puzzle for planetary formation
                    models. There are several possible explanations, but there
                    is not yet enough evidence to establish exactly how the
                    planet formed.
                </p>

                <p>
                    Perhaps future observations will reveal that worlds like
                    GJ 523b are rare accidents. Perhaps they will show that
                    mega-Earths are more common than we thought.
                </p>

                <p>
                    For now, there is something strangely beautiful about not
                    knowing. We look into the darkness, find another world,
                    measure it as carefully as we can, and discover that the
                    universe has once again given us a question instead of
                    an answer.
                </p>
            </article>
        </noscript>
